name: Build VSIX

# Builds the RxdkVs.Package Visual Studio extension (.vsix) on every push to main
# and republishes it as the repo's moving "latest" GitHub Release, so
# .../RXDK-VS20XX/releases/latest always serves the newest build. A v* tag instead
# makes a permanent, versioned release. Mirrors RXDK-VSCode's build-vsix.yml.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the moving "latest" GitHub Release (same as a push to main)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VSIX
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The net8 build engine (Rxdk.Cli + Rxdk.Dap) lives in the RXDK-Tools submodule
          # under external/RXDK-Tools; the VSIX bundles it via the PublishRxdkEngine target.
          submodules: recursive

      # Bundle the LATEST tools, not just the committed pin: fast-forward the engine submodule
      # to the tip of RXDK-Tools' default branch before building, so a freshly-published VSIX
      # always ships the newest build engine.
      - name: Update engine submodule to latest tools
        run: git submodule update --remote --recursive external/RXDK-Tools

      # Puts VS 2022's MSBuild on PATH. The extension is a classic (non-SDK) VSSDK
      # csproj built with MSBuild -- NOT `dotnet build`. The VSSDK build targets and
      # VS SDK reference assemblies are restored from NuGet (PackageReference:
      # Microsoft.VSSDK.BuildTools + Microsoft.VisualStudio.SDK), so `-restore` below
      # supplies them without needing the "VS extension development" workload preinstalled.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # The VSIX build publishes the net8 engine (Rxdk.Cli + Rxdk.Dap) into tools\ via
      # `dotnet publish` (PublishRxdkEngine target), so the .NET 8 SDK must be present.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Packs RxdkVs.Package\TemplateSrc\* into ProjectTemplates\*.zip and stages the
      # scaffold props/targets from samples\ into Scaffold\ -- both are IncludeInVSIX
      # content the package build expects to exist.
      - name: Stage project templates + scaffold
        run: ./scripts/dev.ps1 templates

      - name: Build VSIX (Release)
        run: >
          msbuild RxdkVs.Package/RxdkVs.Package.csproj
          -restore
          -nologo -v:minimal
          -p:Configuration=Release
          -p:DeployExtension=false

      - name: Locate VSIX
        id: vsix
        run: |
          $ErrorActionPreference = 'Stop'
          # The build emits the product-branded rxdk-vs-<version>.vsix beside the raw
          # RxdkVs.Package.vsix; publish the branded one.
          $vsix = Get-ChildItem -Path RxdkVs.Package/bin/Release -Filter rxdk-vs-*.vsix -Recurse |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $vsix) { throw 'rxdk-vs-*.vsix not found after build' }
          "path=$($vsix.FullName)"  >> $env:GITHUB_OUTPUT
          "name=$($vsix.Name)"      >> $env:GITHUB_OUTPUT
          $mb = [math]::Round($vsix.Length / 1MB, 2)
          @(
            '### RXDK for Visual Studio -- VSIX build',
            '',
            "| Artifact | Size |",
            "|----------|------|",
            "| ``$($vsix.Name)`` | ${mb} MB |",
            '',
            'Install: download the `.vsix` and double-click it (VS 2022/2026), or `VSIXInstaller.exe <file>`.',
            'The extension bundles the matching pure-.NET RXDK engine (Rxdk.Cli/Rxdk.Engine/Rxdk.Dap)',
            'under `tools\` and runs it in-place; Xbox headers/libs come from RXDK-SDK.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v5
        with:
          name: rxdk-vs20xx-vsix
          path: ${{ steps.vsix.outputs.path }}
          if-no-files-found: error
          compression-level: 0

      # Build the standalone installer (RXDK-VS-Setup.exe, then zipped to RXDK-VS-Setup.zip):
      # reuses the VSIX just built, stages the engine extracted from it + the Xbox MSBuild platform,
      # and runs Inno Setup 6 (installed on demand via winget/choco by the script). The installer
      # does the full first-run setup (.NET 8, VSIX, Zig/tools/SDK/docs, Xbox platform, MSVC v143),
      # so store-vs-installer users both land ready to build. The zip is the published asset --
      # a bare unsigned .exe trips the browser's "not commonly downloaded" warning.
      - name: Build installer (Inno Setup)
        run: ./installer/build-installer.ps1 -SkipBuild

      - name: Locate installer
        id: setup
        run: |
          $ErrorActionPreference = 'Stop'
          # Ship the installer zipped -- a bare unsigned .exe trips the browser's
          # "this file isn't commonly downloaded" warning; a .zip does not.
          $zip = Get-ChildItem -Path installer/out -Filter 'RXDK-VS-Setup.zip' -Recurse |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $zip) { throw 'RXDK-VS-Setup.zip not found after build' }
          "path=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($zip.Name)"     >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: rxdk-vs20xx-setup
          path: ${{ steps.setup.outputs.path }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    if: |
      github.event_name != 'pull_request' && (
        startsWith(github.ref, 'refs/tags/v') ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download VSIX artifact
        uses: actions/download-artifact@v5
        with:
          name: rxdk-vs20xx-vsix
          path: dist

      - name: Download installer artifact
        uses: actions/download-artifact@v5
        with:
          name: rxdk-vs20xx-setup
          path: dist

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # An explicit v* tag makes a permanent, versioned release.
            tag="${GITHUB_REF#refs/tags/}"; moving=false
          else
            # Push to main (or a manual publish): move a single "latest" release to
            # this build so /releases/latest always serves the newest VSIX.
            tag="latest"; moving=true
          fi
          echo "tag=${tag}"     >> "$GITHUB_OUTPUT"
          echo "moving=${moving}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag} (moving=${moving})"

      - name: Move the 'latest' tag/release to this build
        if: steps.meta.outputs.moving == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        # Delete any prior "latest" release AND its git tag so the create step recreates
        # both at this commit (gh won't move an existing tag). Non-fatal on first run.
        run: gh release delete latest --repo "${{ github.repository }}" --cleanup-tag --yes || true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Publish both the .vsix (Marketplace-style install) and the zipped .exe
          # installer (one-stop first-run setup; zipped to avoid browser download warnings).
          files=(dist/*.vsix dist/*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release assets in dist/" >&2
            exit 1
          fi
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${GITHUB_SHA}" \
            --title "RXDK for Visual Studio ${{ steps.meta.outputs.tag }}" \
            --generate-notes \
            --latest \
            "${files[@]}"

      - name: Write release summary
        shell: bash
        run: |
          {
            echo "### GitHub Release"
            echo ""
            echo "- Tag: \`${{ steps.meta.outputs.tag }}\`"
            echo "- Moving latest: \`${{ steps.meta.outputs.moving }}\`"
            echo "- Assets: \`*.vsix\` (double-click to install in VS 2022/2026) and"
            echo "  \`RXDK-VS-Setup.zip\` (one-stop installer: extension + all prerequisites; unzip and run)"
          } >> "$GITHUB_STEP_SUMMARY"
